
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar compra | InspirArte</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="announcement">Compra segura · Empaque listo para regalar</div>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="index.html">Inspir<span>Arte</span></a>
        <nav class="main-nav"><a href="index.html">Volver a la tienda</a></nav>
        <a class="cart-link" href="carrito.html">Bolsa <span id="cart-count">0</span></a>
      </div>
    </header>
    <main class="checkout-page">
      <h1>Checkout</h1>
        <section class="checkout-card" id="checkout-cart">
          <h2>Your Cart</h2>
          <div id="checkout-items"></div>
        </section>
        <section class="checkout-card">
          <h2>Payment Information</h2>
          <form id="payment-form">
            <label for="customer-name">Nombre completo <span aria-hidden="true">*</span></label>
            <input required id="customer-name" name="customer-name" type="text" autocomplete="name" placeholder="Nombre y apellido">
            <label for="card-name">Nombre del titular de la tarjeta <span aria-hidden="true">*</span></label>
            <input required id="card-name" name="card-name" type="text" autocomplete="cc-name" placeholder="Como aparece en la tarjeta">
            <label for="card-number">Número de tarjeta <span aria-hidden="true">*</span></label>
            <input required aria-describedby="card-number-help" id="card-number" name="card-number" type="text" inputmode="numeric" autocomplete="cc-number" maxlength="19" placeholder="0000 0000 0000 0000">
            <p id="card-number-help" class="field-help">Ingrese el número de su tarjeta de 16 dígitos.</p>
            <div class="field-grid">
              <div><label for="expiry">Vencimiento <span aria-hidden="true">*</span></label><input required id="expiry" name="expiry" type="text" inputmode="numeric" maxlength="5" placeholder="MM/AA"></div>
              <div><label for="cvv">CVV <span aria-hidden="true">*</span></label><input required id="cvv" name="cvv" type="password" inputmode="numeric" maxlength="4" placeholder="123"></div>
            </div>
            <div class="checkout-total"><span>Total a pagar</span><strong id="checkout-total">$0 COP</strong></div>
            <button class="button payment-button" type="submit">Confirmar pedido</button>
            <p id="payment-message" class="payment-message" aria-live="polite"></p>
          </form>
        </section>
    </main>
    <script src="js/store.js"></script>
</body>
</html>
